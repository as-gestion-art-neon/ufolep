server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---- Proxy API (conteneur ufolep86-api) ----
    # ^~ : priorité sur les locations regex (indispensable)
    location ^~ /api/ {
        proxy_pass http://ufolep86-api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Proxy fichiers uploadés (images actualités / galerie) ----
    # ^~ : CRITIQUE — sans lui, la location regex \.(jpg|png…)$ ci-dessous
    # intercepte /uploads/photo.jpg et Nginx cherche le fichier localement
    # au lieu de le proxifier vers l'API => 404, images blanches.
    location ^~ /uploads/ {
        proxy_pass http://ufolep86-api:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ---- Interface d'administration ----
    # ^~ : priorité sur les regex. Pas d'alias (bug nginx alias+try_files),
    # le "root" global suffit : /admin/xyz => /usr/share/nginx/html/admin/xyz
    location ^~ /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    # Cache statique du frontend (hors /admin, déjà capté au-dessus)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Fallback pages principales
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
