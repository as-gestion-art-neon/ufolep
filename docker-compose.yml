version: "3.8"

services:
  app:
    build: .
    container_name: ufolep-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DB_DIR=/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ufolep-net
    ports:
      - "${APP_PORT:-3000}:3000"

  nginx:
    image: nginx:alpine
    container_name: ufolep-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8042}:80"
    depends_on:
      - app
    networks:
      - ufolep-net

networks:
  ufolep-net:
    driver: bridge
