version: "3.8"

services:
  app:
    build: .
    container_name: ufolep-app
    restart: unless-stopped
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?définir ADMIN_PASSWORD dans les variables du stack}
      - SESSION_SECRET=${SESSION_SECRET:?définir SESSION_SECRET dans les variables du stack}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ufolep-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ufolep-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8042}:80"
    depends_on:
      - app
    networks:
      - ufolep-net

networks:
  ufolep-net:
    driver: bridge
