version: "3.8"

services:
  app:
    build: .
    container_name: ufolep-app
    restart: unless-stopped
    volumes:
      - ufolep-db:/data
      - ufolep-uploads:/app/public/images/uploads
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ufolep-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: ufolep-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8042}:80"
    volumes:
      - ufolep-uploads:/data/images/uploads
      - ufolep-pdf:/data/pdf
    depends_on:
      - app
    networks:
      - ufolep-net

volumes:
  ufolep-db:
    driver: local
  ufolep-uploads:
    driver: local
  ufolep-pdf:
    driver: local

networks:
  ufolep-net:
    driver: bridge
